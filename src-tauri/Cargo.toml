[package]
name = "wirebench"
version = "0.12.1"
edition = "2021"
description = "Wirebench — breadboard designer and Arduino simulator"
authors = ["Sudchai Boonto"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
base64 = "0.22"
wb-core = { path = "../crates/wb-core" }
